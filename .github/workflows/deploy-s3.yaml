name: Deploy Portfolio
permissions:
  id-token: write
  contents: read
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::050649355884:role/cloud-resume-github-actions
          aws-region: ap-southeast-1
      - name: Verify AWS Caller Identity
        run: |
          aws sts get-caller-identity
      - name: Deploy Frontend to S3
        run: |
          aws s3 sync frontend/ s3://danishsuffian-resume-s3/
      - name: Invalidate Cloudfront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id E2MC444L6LW7DX --paths "/*"
