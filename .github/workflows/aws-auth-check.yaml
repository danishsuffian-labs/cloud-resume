name: Verify AWS Authentication
permissions:
  id-token: write
  contents: read
on:
  push:
    branches:
      - main
jobs:
  run_job_with_aws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::050649355884:role/cloud-resume-github-actions
          aws-region: ap-southeast-1
      - name: Verify AWS Caller Identity
        run: |
          aws sts get-caller-identity
      - name: Preview Frontend Deployment
        run: |
          aws s3 sync frontend/ s3://danishsuffian-resume-s3/ --dryrun